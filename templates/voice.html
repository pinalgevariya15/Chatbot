<!DOCTYPE html>
<html>
<head>
    <title>Listening...</title>
    <style>
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            color: white;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .wave {
            display: flex;
            gap: 8px;
        }

        .bar {
            width: 6px;
            height: 40px;
            background: #00ffcc;
            animation: wave 1s infinite ease-in-out;
        }

        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
             0%, 100% {
        transform: scale(1);
        opacity: 0.5;
    }
    50% {
        transform: scale(1.8);
        opacity: 1;
    }
        }
    </style>
</head>
<body>
<button class="close-btn" onclick="goBack()">❌</button>
<div class="wave">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div>
<script>
function goBack() {
    window.location.href = "/"; 
}
</script>
</body>
</html>
